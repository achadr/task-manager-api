upstream backend_up {
    zone backend_up 64k;                  # groupe en mémoire partagée (exigé par resolve)
    resolver 127.0.0.11 valid=10s;        # DNS intégré de Docker, réponse gardée 10 s
    server backend:3000 resolve;          # suivre les changements d'adresse de "backend"
}

server {
    listen 80;

    location /api/ {
        proxy_pass http://backend_up/;    # la barre finale RETIRE toujours le /api
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;    # application à page unique
    }
}
