services:
  migrate:
    build:
      context: ./backend
      target: builder
    command: npx prisma migrate deploy
    user: node
    volumes:
      - sqlite-data:/app/data

  backend:
    build: ./backend
    environment:
      NODE_ENV: production
      PORT: 3000
      CORS_ORIGIN: http://localhost:8080
      LOG_LEVEL: info
    volumes:
      - sqlite-data:/app/data
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 15s
      start_interval: 3s

  frontend:
    build: ./frontend
    ports:
      - "8080:80"
    depends_on:
      backend :
        condition: service_healthy

volumes:
  sqlite-data: